<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TouristsGuide — Explore Countries, Spot by Spot</title>
  <meta name="description" content="In-depth travel guides: country overviews, provinces and every major tourist spot with history, religious significance, photos, opening hours and ticket information.">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">

  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem('tg-theme');
      if (!t && window.matchMedia) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="progress" id="scrollProgress"></div>

  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a href="#/" class="brand" aria-label="TouristsGuide home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5c76b"/><stop offset="1" stop-color="#e0864a"/></linearGradient></defs><circle cx="16" cy="16" r="15" fill="url(#bg)"/><path d="M16 6l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#0b1220"/></svg>
        </span>
        <span class="brand__text">Tourists<b>Guide</b></span>
      </a>

      <nav class="nav__links" id="navLinks" aria-label="Main"></nav>

      <div class="nav__actions">
        <button class="icon-btn" id="searchBtn" aria-label="Search" title="Search (/)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <div class="lang" id="langSwitcher"></div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav__burger" id="burgerBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="loader"><span></span></div>
  </main>

  <footer class="footer">
    <div class="container footer__inner" id="footer"></div>
  </footer>

  <!-- Search palette -->
  <div class="modal" id="searchModal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="search" role="dialog" aria-modal="true" aria-label="Search">
      <div class="search__bar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <ul class="search__results" id="searchResults"></ul>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close icon-btn" data-lb="close" aria-label="Close">✕</button>
    <button class="lightbox__nav lightbox__prev icon-btn" data-lb="prev" aria-label="Previous">‹</button>
    <figure class="lightbox__figure">
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
    <button class="lightbox__nav lightbox__next icon-btn" data-lb="next" aria-label="Next">›</button>
  </div>

  <button class="to-top icon-btn" id="toTop" aria-label="Back to top">↑</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Configuration: languages + country registry -->
  <script src="js/config.js"></script>
  <!-- UI translations (one file per language) -->
  <script src="i18n/en.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
